url: https://iangow.github.io/db2pqr/

template:
  bootstrap: 5

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [github]

reference:
  - title: PostgreSQL to Parquet
    desc: >
      Functions for creating Parquet data from PostgreSQL sources.
    contents:
      - db_to_pq
      - db_schema_to_pq
      - db_schema_tables
      - lazy_tbl_to_pq
      - tbl_to_pq
  - title: WRDS to Parquet
    desc: >
      Functions for creating Parquet data from WRDS.
    contents:
      - wrds_update_pq
      - wrds_schema_to_pq
      - wrds_sql_to_pq
      - wrds_get_tables
  - title: WRDS authentication and configuration
    contents:
      - wrds_get_username
      - wrds_conninfo
      - wrds_connect_dbi
      - wrds_check_credentials
  - title: Parquet file utilities
    desc: >
      Some useful functions for managing Parquet data repositories.
    contents:
      - pq_data_dir
      - pq_last_modified
      - pq_archive
      - pq_restore
      - pq_remove
  - title: ADBC development helpers
    desc: >
      ADBC support is experimental, as ABDC drivers are still 
      early in their development.
    contents:
      - adbc_diagnostics
      - con_to_adbi
      - tbl_to_pq_debug

articles:
  - title: Workflows
    navbar: Workflows
    contents:
      - data-management
      - wrds-to-parquet
      - authentication
      - wrds-ssh
      - postgres-to-parquet
      - parquet-utilities-examples
      - adbc
